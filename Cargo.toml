[workspace]
members = [
    "crates/player-core",
    "crates/player-mpv",
    "crates/player-platform",
    "crates/player-ui",
    "crates/yyplayer-app",
]
resolver = "3"

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.92"
publish = false
license = "GPL-3.0-only"

[workspace.dependencies]
player-core = { path = "crates/player-core" }
player-mpv = { path = "crates/player-mpv" }
player-platform = { path = "crates/player-platform" }
player-ui = { path = "crates/player-ui" }
slint = { version = "=1.17.1", default-features = false, features = [
    "std", "compat-1-2", "backend-winit", "renderer-femtovg", "accessibility", "unstable-winit-030",
] }
slint-build = "=1.17.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-channel = "0.5"
libloading = "0.8"
glow = "0.17"
sha2 = "0.10"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
