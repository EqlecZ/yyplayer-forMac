name: Windows x64 packages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build portable and setup packages
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install stable Rust for MSVC x64
        run: |
          rustup toolchain install stable --profile minimal --target x86_64-pc-windows-msvc --no-self-update
          rustup default stable
          $target = rustc -vV | Select-String '^host: x86_64-pc-windows-msvc$'
          if (-not $target) { throw 'The active Rust compiler is not the Windows x64 MSVC host.' }

      - name: Check packaging tools
        run: |
          if (-not (Get-Command 7z.exe -ErrorAction SilentlyContinue)) { throw '7-Zip is required to extract the verified mpv runtime archive.' }
          if (-not (Get-Command makensis.exe -ErrorAction SilentlyContinue)) { throw 'NSIS is required to create the setup installer.' }

      - name: Download and verify pinned libmpv runtime
        run: ./scripts/Get-Mpv.ps1

      - name: Generate multi-size Windows application icon
        run: ./scripts/Build-AppIcon.ps1

      - name: Test automatic build and packaging failure boundaries
        run: ./scripts/Test-WindowsPackaging.ps1 -NsisCompiler (Get-Command makensis.exe).Source

      - name: Build Windows x64 Release and package portable ZIP and NSIS setup
        run: ./scripts/Package-Windows.ps1

      - name: Upload both Windows x64 release packages
        uses: actions/upload-artifact@v7
        with:
          name: YYPlayer-windows-x64-${{ github.sha }}
          path: |
            dist/YYPlayer-*-windows-x64-portable.zip
            dist/YYPlayer-*-windows-x64-setup.exe
          if-no-files-found: error
          retention-days: 30

